name: Test TCP voice transports

on:
  push:
    branches: ['tcp/26.*']
  pull_request:
    branches: ['tcp/26.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Run real TCP and UDP transport regressions
        run: bash scripts/test-tcp.sh
      - name: Run Folia scheduling and entity lifecycle regressions
        run: python3 tests/folia/run.py
      - name: Run central proxy protocol regressions
        run: bash scripts/test-proxy.sh
      - name: Run TCP and mixed UDP proxy session regressions
        run: bash scripts/test-runtime.sh
      - name: Run actual client lifecycle regressions with game and audio doubles
        run: python3 tests/client/run.py
